<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:16px system-ui}header{padding:20px;background:#122239;color:white;display:flex;align-items:center;gap:16px}header img{max-width:70px;max-height:50px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:16px}button{background:var(--cor,#2563eb);color:white;border:0;border-radius:7px;padding:10px;cursor:pointer}main{max-width:1100px;margin:auto;padding:20px}.card{background:white;border-radius:12px;padding:20px;margin:12px 0}label{display:block;margin:10px 0}input,select{display:block;padding:9px;max-width:100%;width:320px;border:1px solid #cbd5e1;border-radius:6px}.grid{display:flex;flex-wrap:wrap;gap:24px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}.aviso{padding:14px;background:#fff1cc}small{color:#475569}</style><header><img id="logo" alt="" hidden><h1 id="marca">Gestão 3D</h1></header><div class="aviso">Versão inicial local — sem banco online, login ou APIs conectadas. Dados somente neste navegador. Exporte backups. Não insira credenciais.</div><nav id="menu"></nav><main id="conteudo"></main><script>
'use strict';
const STORE='gestao3d_v1';
let state={products:[],settings:{name:'Gestão 3D',color:'#2563eb',logo:''}};
let storageError='';try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&Array.isArray(saved.products)&&saved.settings)state=saved}catch(e){storageError='Não foi possível ler os dados locais. Nada foi apagado. Exporte os dados antes de continuar.'}
const modules=['Painel','Produtos e preços','Compras','Estoque','Produção','Vendas','Financeiro','Tendências','Publicidade','Conexões','Configurações'];
const root=document.getElementById('conteudo');const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){alert('Falha ao salvar: armazenamento indisponível ou cheio. Exporte um backup.');return false}}
function brand(){document.getElementById('marca').textContent=state.settings.name;document.documentElement.style.setProperty('--cor',/^#[0-9a-f]{6}$/i.test(state.settings.color)?state.settings.color:'#2563eb');const img=document.getElementById('logo');img.hidden=!state.settings.logo;if(/^data:image\/(png|jpeg|webp);base64,/.test(state.settings.logo))img.src=state.settings.logo;else img.hidden=true}
function calc(p){let cost=p.grams*p.kg/1000+p.hours*(p.machine+p.watts/1000*p.kwh)+p.labor+p.pack+p.parts;cost*=1+p.loss/100;const denominator=1-(p.margin+p.fees+p.tax)/100;return{cost,price:denominator>0?(cost+p.fixed)/denominator:null}}
function field(id,label,value=0,type='number'){return `<label>${label}<input name="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':'maxlength="140"'} required></label>`}
function show(name){root.innerHTML=`<h2>${esc(name)}</h2>`;if(storageError){const p=document.createElement('p');p.textContent=storageError;root.append(p)}
if(name==='Painel'){root.innerHTML+=`<div class="card"><h3>${state.products.length} produtos cadastrados nesta versão</h3><p>Modo local. Vendas, faturamento e resultados publicitários indisponíveis até conectar fontes reais.</p><p>Os cadastros da página anterior permanecem separados e não foram migrados.</p></div>`}
else if(name==='Produtos e preços'){root.innerHTML+=`<div class="card"><p>Margem sobre o preço de venda. Taxas e impostos neste cálculo incidem sobre a mesma base. Cadastre um cenário por produto/canal. Perdas são uma provisão percentual sobre o custo direto.</p><form id="produto"><div class="grid">${field('name','Produto','','text')}${field('sku','SKU','','text')}<label>Categoria<select name="category"><option>Natal</option><option>Home</option><option>Carro</option><option>Pet</option><option>Organização</option><option>Outros</option></select></label><label>Canal<select name="channel"><option>Direto</option><option>Shopee</option><option>Mercado Livre</option><option>TikTok Shop</option></select></label>${field('grams','Material consumido (g)')}${field('kg','Material (R$/kg)',89)}${field('hours','Horas de impressão')}${field('machine','Máquina (R$/h), sem energia')}${field('watts','Potência média (W)')}${field('kwh','Energia (R$/kWh)',1)}${field('labor','Mão de obra (R$)')}${field('pack','Embalagem (R$)')}${field('parts','Componentes (R$)')}${field('loss','Provisão de perdas (%)')}${field('margin','Margem desejada sobre venda (%)',30)}${field('fees','Taxas do canal (%)')}${field('tax','Impostos (%)')}${field('fixed','Despesa fixa por venda (R$)')}</div><button>Salvar cenário</button></form></div><div class="card scroll"><table><thead><tr><th>Produto / SKU</th><th>Categoria / canal</th><th>Custo com perdas</th><th>Preço-alvo</th><th>Ação</th></tr></thead><tbody>${state.products.map(p=>{const c=calc(p);return `<tr><td>${esc(p.name)} / ${esc(p.sku)}</td><td>${esc(p.category)} / ${esc(p.channel)}</td><td>${money(c.cost)}</td><td>${c.price===null?'Inválido':money(c.price)}</td><td><button data-delete="${esc(p.id)}">Excluir</button></td></tr>`}).join('')}</tbody></table></div>`;document.getElementById('produto').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target),p={id:crypto.randomUUID()};for(const [k,v]of data)p[k]=['name','sku','category','channel'].includes(k)?v.trim():Number(v);if(!p.name||!p.sku||Object.values(p).some(v=>typeof v==='number'&&(!Number.isFinite(v)||v<0))||calc(p).price===null)return alert('Preencha dados válidos. A soma de margem, taxas e impostos deve ser menor que 100%.');state.products.push(p);save();show(name)};root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este cenário?')){state.products=state.products.filter(p=>p.id!==b.dataset.delete);save();show(name)}})}
else if(name==='Configurações'){root.innerHTML+=`<div class="card"><form id="config">${field('name','Nome da empresa',state.settings.name,'text')}<label>Cor principal<input name="color" type="color" value="${esc(state.settings.color)}"></label><label>Logotipo PNG, JPEG ou WebP, até 300 KB<input id="arquivo" type="file" accept="image/png,image/jpeg,image/webp"></label><button>Salvar identidade</button></form><p><button id="exportar">Exportar backup JSON</button></p><small>O backup inclui os cadastros desta versão e a identidade visual. A importação e migração para banco online serão implementadas em etapa posterior.</small></div>`;document.getElementById('config').onsubmit=async e=>{e.preventDefault();const f=document.getElementById('arquivo').files[0];if(f&&(f.size>300000||!['image/png','image/jpeg','image/webp'].includes(f.type)))return alert('Use PNG, JPEG ou WebP até 300 KB.');const data=new FormData(e.target);state.settings.name=data.get('name').trim();state.settings.color=data.get('color');if(f)state.settings.logo=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});if(save()){brand();alert('Identidade salva neste navegador.')}};document.getElementById('exportar').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='gestao3d-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
else if(name==='Conexões'){root.innerHTML+=['Mercado Livre — comercial','Mercado Ads — publicidade','Shopee — comercial','Shopee Ads — publicidade','TikTok Shop — comercial','TikTok Ads — publicidade','Banco online'].map(c=>`<div class="card"><h3>${c}</h3><p>Não configurado. Integração ainda não implementada.</p><small>Requer serviço no servidor, autorização e validação das permissões. Não envie tokens ou segredos para este site público.</small></div>`).join('')}
else if(name==='Publicidade'){root.innerHTML+='<div class="card"><h3>Planejado — nenhuma campanha conectada</h3><p>Campanhas, orçamento, resultados e ações de impulsionamento serão implementados por API oficial, conforme permissões. Nenhum gasto ou alteração de campanha é executado nesta versão.</p></div>'}
else if(name==='Tendências'){root.innerHTML+='<div class="card"><h3>Planejado — nenhuma fonte conectada</h3><p>Segmentos previstos: Natal, Home, Carro, Pet e Organização. Indicadores deverão identificar fonte, período e distinção entre procura estimada e vendas observadas. Sem dados fictícios.</p></div>'}
else{root.innerHTML+='<div class="card"><h3>Módulo planejado — ainda não implementado</h3><p>Esta área será desenvolvida nas próximas etapas. Nenhuma operação deste módulo é registrada nesta versão.</p></div>'}}
for(const name of modules){const b=document.createElement('button');b.textContent=name;b.onclick=()=>show(name);document.getElementById('menu').append(b)}brand();show('Painel');
</script></html>
