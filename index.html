<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressão 3D — Cadastro e Precificação</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px;color:#22303c}.card{background:#fff;padding:20px;border-radius:14px;max-width:1100px;margin:auto;box-shadow:0 3px 14px #0001}h1{margin:0 0 6px;color:#16324f}p.sub{margin:0 0 18px;color:#5c6b7a}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-size:12px;font-weight:bold;display:block;margin-bottom:4px}input,select{width:100%;padding:10px;border:1px solid #ccd4dc;border-radius:8px}button{margin-top:14px;padding:12px 20px;border:0;border-radius:8px;background:#0d6efd;color:#fff;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:22px;font-size:14px}th,td{border-bottom:1px solid #e3e8ee;padding:10px;text-align:left}th{background:#eef3f8}.preco{font-weight:bold;color:#0a7d34}.excluir{color:#c0392b;text-decoration:none}.limpar{background:#6c757d;margin-left:8px}.total{margin-top:16px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>🖨️ Cadastro e precificação — Impressão 3D</h1>
<p class="sub">Cadastre produtos, calcule custos e visualize o preço sugerido. Os dados ficam salvos neste navegador.</p>
<form id="form">
<div><label>Nome do produto</label><input id="nome" required></div>
<div><label>Categoria</label><input id="categoria" value="Impressão 3D"></div>
<div><label>Material</label><select id="material"><option>PLA</option><option>PETG</option><option>ABS</option><option>ASA</option><option>TPU</option><option>Resina</option></select></div>
<div><label>Peso da peça (g)</label><input id="peso" type="number" step="0.01" value="0"></div>
<div><label>Custo do material (R$/g)</label><input id="custoMaterial" type="number" step="0.01" value="0"></div>
<div><label>Horas de impressão</label><input id="horas" type="number" step="0.1" value="0"></div>
<div><label>Custo da máquina (R$/h)</label><input id="custoMaquina" type="number" step="0.01" value="0"></div>
<div><label>Custo de energia (R$/h)</label><input id="custoEnergia" type="number" step="0.01" value="0"></div>
<div><label>Acabamento (R$)</label><input id="acabamento" type="number" step="0.01" value="0"></div>
<div><label>Margem (%)</label><input id="margem" type="number" step="0.1" value="30"></div>
<div><label>Impostos / taxas (%)</label><input id="imposto" type="number" step="0.1" value="0"></div>
<div style="grid-column:1/-1"><button type="submit">Cadastrar produto</button><button type="button" class="limpar" onclick="limpar()">Limpar dados</button></div>
</form>
<table>
<thead><tr><th>Produto</th><th>Material</th><th>Peso</th><th>Horas</th><th>Custo total</th><th>Preço sugerido</th><th></th></tr></thead>
<tbody id="tabela"></tbody>
</table>
<div class="total" id="resumo"></div>
</div>
<script>
const chave='impressao3d_produtos';
let produtos=JSON.parse(localStorage.getItem(chave)||'[]');
function salvar(){localStorage.setItem(chave,JSON.stringify(produtos));renderizar()}
function moeda(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')}
function calcular(p){const material=(p.peso||0)*(p.custoMaterial||0);const impressao=(p.horas||0)*((p.custoMaquina||0)+(p.custoEnergia||0));const custo=material+impressao+(p.acabamento||0);const preco=custo*(1+(p.margem||0)/100)*(1+(p.imposto||0)/100);return{material,impressao,custo,preco}}
function renderizar(){const tbody=document.getElementById('tabela');tbody.innerHTML='';let custoTotal=0,vendaTotal=0;produtos.forEach((p,i)=>{const c=calcular(p);custoTotal+=c.custo;vendaTotal+=c.preco;tbody.innerHTML+=`<tr><td><b>${p.nome}</b><br><small>${p.categoria||''}</small></td><td>${p.material}</td><td>${Number(p.peso||0).toFixed(1)} g</td><td>${Number(p.horas||0).toFixed(1)} h</td><td>${moeda(c.custo)}</td><td class="preco">${moeda(c.preco)}</td><td><a class="excluir" href="#" onclick="excluir(${i});return false">Excluir</a></td></tr>`});document.getElementById('resumo').textContent=`Total cadastrado: ${produtos.length} produto(s) | Custo total: ${moeda(custoTotal)} | Preço total sugerido: ${moeda(vendaTotal)}`}
function excluir(i){if(confirm('Excluir este produto?')){produtos.splice(i,1);salvar()}}
function limpar(){if(confirm('Apagar todos os produtos salvos neste navegador?')){produtos=[];salvar()}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const g=id=>parseFloat(document.getElementById(id).value)||0;const p={nome:document.getElementById('nome').value,categoria:document.getElementById('categoria').value,material:document.getElementById('material').value,peso:g('peso'),custoMaterial:g('custoMaterial'),horas:g('horas'),custoMaquina:g('custoMaquina'),custoEnergia:g('custoEnergia'),acabamento:g('acabamento'),margem:g('margem'),imposto:g('imposto')};produtos.push(p);salvar();e.target.reset();document.getElementById('categoria').value='Impressão 3D';document.getElementById('margem').value=30});
renderizar();
</script>
</body>
</html>
