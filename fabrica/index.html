}else if(page==='Produção'){root.innerHTML+='<div class="notice">Fila manual sem reserva automática de capacidade/material. Um material principal por ordem; componentes usam ajustes separados. Status de pedido não cria ordem automaticamente.</div>';root.innerHTML+=form('job',select('product','Produto',db.products.filter(p=>p.material).map(p=>[p.id,p.name+' / '+p.channel]))+select('machine','Impressora',db.machines.filter(m=>m.enabled).map(m=>[m.id,m.name]))+field('quantity','Quantidade','number',1)+field('due','Prazo','date',day()),'Abrir ordem');root.innerHTML+=table(['Produto','Máquina','Quantidade','Previsto (min)','Real (min)','Prazo','Estado','Ação'],db.jobs.map(j=>[name('products',j.product),name('machines',j.machine),j.quantity,j.plannedMinutes,j.actualMinutes??'—',esc(j.due),esc(j.status),j.status==='Aberta'?button('finish',j.id,'Concluir')+' '+button('cancelJob',j.id,'Cancelar'):'']));bind('job',d=>save('Produção aberta',s=>{const p=get(s,'products',d.product),m=get(s,'machines',d.machine),q=integer(d.quantity);if(!p.material||!m.enabled)throw Error('Produto deve ter material e impressora disponível.');s.jobs.push({id:uid(),product:p.id,material:p.material,grams:p.grams,machine:m.id,quantity:q,plannedMinutes:p.minutes*q,status:'Aberta',due:date(d.due),createdAt:now()})}));
}else if(page==='Pedidos'){root.innerHTML+=form('order',field('reference','Número / referência do pedido')+select('client','Cliente (opcional)',[['','Usar identificação abaixo'],...options('clients')],'',false)+field('customer','Identificação do cliente')+select('product','Produto / canal',options('products'))+field('quantity','Quantidade','number',1)+field('unitPrice','Preço unitário (R$)','number',0)+field('due','Vencimento financeiro','date',day())+field('shipPlan','Despacho previsto','date','',[],false)+field('deliveryPlan','Entrega prevista','date','',[],false),'Criar pedido');bind('order',d=>save('Pedido criado',s=>{if(s.orders.some(o=>o.reference===d.reference.trim()))throw Error('Referência duplicada.');const p=get(s,'products',d.product),q=integer(d.quantity),unitPrice=num(d.unitPrice,true),total=round(q*unitPrice),cost=pricing(p).cost,a=date(d.shipPlan,true),b=date(d.deliveryPlan,true),id=uid();if(d.client)get(s,'clients',d.client);if(a&&b&&b<a)throw Error('Entrega prevista anterior ao despacho.');s.orders.push({id,reference:text(d.reference),customer:text(d.customer),client:d.client,product:p.id,productName:p.name,category:p.category,channel:p.channel,quantity:q,unitPrice,total,contribution:round(total*(1-(p.fees+p.tax)/100)-q*cost-p.fixed),createdAt:now(),status:stages[0],history:[{status:stages[0],at:now()}],shipPlan:a,deliveryPlan:b,shipActual:'',deliveryActual:'',carrier:'',tracking:''});bill(s,'Receber','Pedido '+d.reference,total,d.due,id)}));document.querySelector('#order [name=client]').onchange=e=>{const c=db.clients.find(c=>c.id===e.target.value);if(c)document.querySelector('#order [name=customer]').value=c.name};report('orders');
}else if(page==='Contas'){root.innerHTML+='<div class="notice">Caixa bruto, não lucro contábil. Não repita manualmente contas geradas por compras, despesas ou pedidos.</div>';root.innerHTML+=form('bill',select('type','Tipo',[['Pagar','Pagar'],['Receber','Receber']])+field('description','Descrição')+field('value','Valor (R$)','number',0)+field('due','Vencimento','date',day()),'Adicionar conta');bind('bill',d=>save('Conta registrada',s=>{if(!['Pagar','Receber'].includes(d.type))throw Error('Tipo inválido.');bill(s,d.type,text(d.description),d.value,d.due,'manual')}));root.innerHTML+=table(['Descrição','Tipo','Vencimento','Valor','Estado','Ação'],db.finance.map(f=>[esc(f.description),esc(f.type),esc(f.due),money(f.value),esc(f.status),f.status==='Aberto'?button('settle',f.id,'Liquidar'):'']));
}else if(['Vendas e entregas','Despesas por período','Financeiro por período','Produção por período'].includes(page)){report({'Vendas e entregas':'orders','Despesas por período':'expenses','Financeiro por período':'finance','Produção por período':'jobs'}[page]);
}else if(page==='Empresa e backup'){root.innerHTML+=form('settings',field('name','Nome da empresa','text',db.settings.name)+field('color','Cor de destaque','color',db.settings.color));bind('settings',d=>save('Identidade salva',s=>{s.settings.name=text(d.name);if(!/^#[0-9a-f]{6}$/i.test(d.color))throw Error('Cor inválida.');s.settings.color=d.color}));root.innerHTML+='<div class="card"><label>Logotipo PNG/JPEG/WebP, até 300 KB<input type="file" id="image" accept="image/png,image/jpeg,image/webp"></label><div class="actions"><button id="backup">Exportar backup JSON</button></div><p>Esta versão usa armazenamento separado. As versões anteriores e seus cadastros foram preservados. Não há migração automática, restauração de arquivos ou sincronização entre dispositivos.</p></div>';document.getElementById('backup').onclick=()=>download('fabrica3d-'+day()+'.json',JSON.stringify(db,null,2),'application/json');document.getElementById('image').onchange=e=>safe(()=>{const f=e.target.files[0];if(!f)return;if(f.size>300000||!['image/png','image/jpeg','image/webp'].includes(f.type))throw Error('Imagem inválida ou acima de 300 KB.');const reader=new FileReader();reader.onload=()=>safe(()=>save('Logotipo salvo',s=>s.settings.logo=String(reader.result)));reader.onerror=()=>tell('Falha ao ler imagem.',true);reader.readAsDataURL(f)});
}else if(page==='Histórico')root.innerHTML+=table(['Data UTC','Operação'],db.audit.slice().reverse().map(a=>[esc(a.at),esc(a.action)]));
wire(root);}
function wire(container){container.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>safe(()=>act(b.dataset.action,b.dataset.id)))}
function report(kind){const order=kind==='orders',dates=order?[['createdAt','Cadastro'],['shipPlan','Despacho previsto'],['shipActual','Despacho realizado'],['deliveryPlan','Entrega prevista'],['deliveryActual','Entrega realizada']]:kind==='expenses'?[['date','Despesa'],['due','Vencimento']]:kind==='finance'?[['due','Vencimento'],['paidAt','Liquidação']]:[['due','Prazo'],['createdAt','Cadastro'],['finishedAt','Conclusão']];let fields=select('dateField','Filtrar pela data de',dates,dates[0][0])+field('start','De','date','',[],false)+field('end','Até','date','',[],false)+field('query','Busca: referência / cliente / descrição','text','',[],false);for(const [k,l]of order?[['channel','Canal'],['category','Categoria'],['status','Status'],['client','Cliente']]:kind==='expenses'?[['category','Categoria'],['channel','Canal / centro de custo']]:kind==='finance'?[['type','Tipo'],['status','Status']]:[['machine','Impressora'],['status','Status']]){const items=[...new Set(db[kind].map(x=>x[k]).filter(Boolean))];fields+=select(k,l,[['','Todos'],...items.map(v=>[v,k==='client'?db.clients.find(c=>c.id===v)?.name||v:k==='machine'?db.machines.find(m=>m.id===v)?.name||v:v])],'',false)}root.innerHTML+=form('filters',fields,'Aplicar filtros')+'<div class="actions"><button id="csv" class="secondary">Exportar resultado CSV</button><button id="print" class="secondary">Imprimir relatório</button></div><div id="results"></div>';const apply=f=>{if(f.start)date(f.start);if(f.end)date(f.end);if(f.start&&f.end&&f.start>f.end)throw Error('Período inválido.');const rows=db[kind].filter(x=>{const raw=x[f.dateField]||'',d=raw.includes('T')?day(raw):raw;return (!f.start||(d&&d>=f.start))&&(!f.end||(d&&d<=f.end))&&['channel','category','status','client','machine','type'].every(k=>!f[k]||x[k]===f[k])&&(!f.query||[x.reference,x.customer,x.description,x.productName].join(' ').toLocaleLowerCase().includes(f.query.toLocaleLowerCase()))});let h,data;if(order){h=['Pedido','Cliente','Produto','Canal','Categoria','Qtd','Total','Atual','Próximo previsto','Despacho previsto','Despacho realizado','Entrega prevista','Entrega realizada'];data=rows.map(o=>[o.reference,o.customer,o.productName,o.channel,o.category,o.quantity,o.total,o.status,next(o),o.shipPlan,o.shipActual,o.deliveryPlan,o.deliveryActual])}else if(kind==='expenses'){h=['Data','Descrição','Categoria','Canal','Valor'];data=rows.map(x=>[x.date,x.description,x.category,x.channel,x.value])}else if(kind==='finance'){h=['Tipo','Descrição','Vencimento','Valor','Estado','Liquidação'];data=rows.map(x=>[x.type,x.description,x.due,x.value,x.status,x.paidAt])}else{h=['Produto','Impressora','Qtd','Prazo','Previsto (min)','Real (min)','Estado'];data=rows.map(j=>[db.products.find(p=>p.id===j.product)?.name,db.machines.find(m=>m.id===j.machine)?.name,j.quantity,j.due,j.plannedMinutes,j.actualMinutes,j.status])}exportRows=[h,...data];const out=document.getElementById('results');out.innerHTML=`<div class="notice">${rows.length} registro(s). ${order?'Total não cancelado: '+money(rows.filter(o=>o.status!=='Cancelado').reduce((a,o)=>a+o.total,0))+'. Não equivale a recebimentos.':''}</div>`+table(order?[...h,'Detalhes']:h,data.map((r,i)=>order?[...r.map(esc),button('detail',rows[i].id,'Abrir')]:r.map(esc)));wire(out)};bind('filters',apply);apply(Object.fromEntries(new FormData(document.getElementById('filters'))));document.getElementById('csv').onclick=()=>{const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';download('relatorio-'+kind+'.csv','\uFEFF'+exportRows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')};document.getElementById('print').onclick=()=>window.print()}
function download(filename,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function modal(title,html){dialog.innerHTML='<div class="actions"><h2>'+esc(title)+'</h2><button type="button" id="close" class="secondary">Fechar</button></div>'+html;document.getElementById('close').onclick=()=>dialog.close();dialog.showModal()}
function act(a,id){if(a==='edit'){edit=id;render();return}if(a==='detail'){detail(id);return}if(a==='finish'){const j=get(db,'jobs',id);modal('Concluir produção',form('finish',field('approved','Unidades aprovadas','number',j.quantity)+field('consumed','Consumo real de material (g)','number',j.grams*j.quantity)+field('actualMinutes','Tempo real total (min)','number',j.plannedMinutes||1),'Concluir'));bind('finish',d=>{save('Produção concluída',s=>{const x=get(s,'jobs',id),approved=num(d.approved);if(x.status!=='Aberta')throw Error('Ordem já processada.');if(!Number.isInteger(approved)||approved>x.quantity)throw Error('Quantidade aprovada inválida.');const consumed=num(d.consumed,true),actualMinutes=num(d.actualMinutes,true);move(s,'material',x.material,-consumed,'Produção '+id);if(approved)move(s,'product',x.product,approved,'Produção '+id);Object.assign(x,{approved,consumed,actualMinutes,status:'Concluída',finishedAt:now()})});dialog.close()});return}if(!confirm('Confirmar operação?'))return;save('Operação '+a,s=>{if(a==='receive'){const p=get(s,'purchases',id);if(p.status!=='Aberta')throw Error('Compra já processada.');const m=get(s,'materials',p.material),old=balance(s,'material',m.id);m.unitCost=(old*m.unitCost+p.total)/(old+p.quantity);move(s,'material',m.id,p.quantity,'Compra '+id);bill(s,'Pagar','Compra de '+m.name,p.total,p.due,id);p.status='Recebida';p.receivedAt=now()}else if(a==='cancelPurchase'){const p=get(s,'purchases',id);if(p.status!=='Aberta')throw Error('Compra já processada.');p.status='Cancelada'}else if(a==='cancelJob'){const j=get(s,'jobs',id);if(j.status!=='Aberta')throw Error('Ordem já processada.');j.status='Cancelada'}else if(a==='settle'){const f=get(s,'finance',id);if(f.status!=='Aberto')throw Error('Conta já processada.');f.status='Liquidado';f.paidAt=now()}else throw Error('Ação desconhecida.')})}
function detail(id){const o=get(db,'orders',id),nxt=next(o);let html=`<p>${esc(o.customer)} · ${esc(o.channel)} · ${esc(o.productName)} · ${money(o.total)}</p><div class="notice">Atual: <strong>${esc(o.status)}</strong> · Próximo previsto: <strong>${esc(nxt)}</strong></div>`;html+=form('dates',field('shipPlan','Despacho previsto','date',o.shipPlan,[],false)+field('deliveryPlan','Entrega prevista','date',o.deliveryPlan,[],false),'Salvar previsões');html+=table(['Marco','Informação'],[['Despacho realizado',esc(o.shipActual||'Não realizado')],['Entrega realizada',esc(o.deliveryActual||'Não realizada')],['Transportadora',esc(o.carrier||'Não informada')],['Rastreamento',esc(o.tracking||'Não informado')]]);if(!['Concluído','Encerrado'].includes(nxt)){let fields='';if(['Despachado','Entregue'].includes(nxt))fields+=field('date',nxt==='Despachado'?'Despacho realizado':'Entrega realizada','date',day());if(nxt==='Despachado')fields+=field('carrier','Transportadora / modalidade')+field('tracking','Rastreio (opcional)','text','',[],false);html+=form('advance',fields,'Avançar para '+nxt)}if(!['Despachado','Entregue','Cancelado'].includes(o.status))html+='<button type="button" id="cancelOrder" class="secondary">Cancelar pedido</button>';html+='<h2>Histórico do pedido</h2>'+table(['Status','Data UTC'],o.history.map(h=>[esc(h.status),esc(h.at)]));modal('Pedido '+o.reference,html);bind('dates',d=>{save('Previsões atualizadas',s=>{const x=get(s,'orders',id),a=date(d.shipPlan,true),b=date(d.deliveryPlan,true);if(a&&b&&b<a)throw Error('Entrega prevista anterior ao despacho.');x.shipPlan=a;x.deliveryPlan=b});dialog.close()});bind('advance',d=>{save('Status atualizado',s=>{const x=get(s,'orders',id),i=stages.indexOf(x.status);if(i<0||i===stages.length-1)throw Error('Pedido encerrado.');const target=stages[i+1];if(target==='Despachado'){const actual=date(d.date);if(actual>day()||actual<day(x.createdAt))throw Error('Data real de despacho inválida.');move(s,'product',x.product,-x.quantity,'Despacho '+id);x.shipActual=actual;x.carrier=text(d.carrier);x.tracking=String(d.tracking||'').trim().slice(0,200)}if(target==='Entregue'){const actual=date(d.date);if(actual<x.shipActual||actual>day())throw Error('Data de entrega real inválida.');x.deliveryActual=actual}x.status=target;x.history.push({status:target,at:now()})});dialog.close()});const cancel=document.getElementById('cancelOrder');if(cancel)cancel.onclick=()=>safe(()=>{if(!confirm('Cancelar pedido e recebível em aberto?'))return;save('Pedido cancelado',s=>{const x=get(s,'orders',id);if(['Despachado','Entregue','Cancelado'].includes(x.status)||s.finance.some(f=>f.source===id&&f.status==='Liquidado'))throw Error('Este pedido exige devolução/estorno, não disponível nesta versão.');x.status='Cancelado';x.history.push({status:x.status,at:now()});s.finance.filter(f=>f.source===id&&f.status==='Aberto').forEach(f=>f.status='Cancelado')});dialog.close()})}
for(const [group,items]of Object.entries(groups)){const details=document.createElement('details');details.open=true;const summary=document.createElement('summary');summary.textContent=group;details.append(summary);for(const title of items){const b=document.createElement('button');b.textContent=title;b.onclick=()=>{page=title;edit=null;message.hidden=true;document.body.classList.remove('open');render()};details.append(b)}document.getElementById('nav').append(details)}document.getElementById('toggle').onclick=()=>document.body.classList.toggle('open');window.addEventListener('storage',e=>{if(e.key===KEY)tell('Dados alterados em outra aba. Recarregue antes de salvar.',true)});render();})();
</script></html>
