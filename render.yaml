services:
  - type: web
    name: fabrica3d-anycubic
    runtime: docker
    plan: free
    branch: integracao-anycubic
    dockerfilePath: ./Dockerfile
    dockerCommand: python integracao/multi_server.py
    healthCheckPath: /healthz
    envVars:
      - key: PANEL_USER
        value: operador
      - key: PANEL_PASSWORD
        generateValue: true
      - key: VAULT_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fabrica3d-contas-teste
          property: connectionString
databases:
  - name: fabrica3d-contas-teste
    plan: free
    ipAllowList: []
