<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão 3D | Painel</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6fa;color:#1d2b42}button,a,input{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:242px;background:#12233e;color:#bfcce1;padding:26px 16px;overflow:auto}.brand{display:flex;align-items:center;gap:12px;color:white;padding:0 10px 26px;font-size:20px;font-weight:700}.brand img{max-width:42px;max-height:42px}.brand span{overflow-wrap:anywhere}.section{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;margin:24px 12px 8px;color:#8ba1c1}nav button{display:block;width:100%;text-align:left;padding:11px 14px;background:none;color:#c3cfe0;border:0;border-radius:8px;margin:3px 0}nav button:hover,nav button.active{background:#26456e;color:white}nav button.active{box-shadow:inset 3px 0 #60a5fa}.sidefoot{font-size:11px;line-height:1.7;padding:24px 12px;color:#9aafcd}.layout{margin-left:242px}header{height:76px;padding:0 32px;background:white;border-bottom:1px solid #e4e9f2;display:flex;align-items:center;justify-content:space-between;gap:15px}header small{display:block;color:#718098;margin-bottom:4px}.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#fff5dc;color:#875d10;font-size:12px}.mobile{display:none;background:#edf2fa;border:0;padding:9px;border-radius:6px}main{padding:30px;max-width:1600px;margin:auto}h1{font-size:27px;margin:0 0 7px;letter-spacing:-.6px}h2{font-size:15px;margin:0}p{line-height:1.6;color:#6c7c92}.intro{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.primary{background:#2563eb;color:white;border:0;border-radius:8px;padding:11px 16px;text-decoration:none;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e4e9f2;border-radius:12px;padding:22px;box-shadow:0 3px 10px #152a4603}.metric{border-top:3px solid #4f80e8}.metric:nth-child(2){border-top-color:#26a18a}.metric:nth-child(3){border-top-color:#e3a542}.metric:nth-child(4){border-top-color:#8b72df}.label{color:#62738b;font-size:12px}.value{font-size:29px;font-weight:700;margin:13px 0 5px}.hint{font-size:11px;color:#7c899d}.columns{display:grid;grid-template-columns:1.65fr 1fr;gap:18px;margin-top:20px}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.empty{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.empty strong{font-size:15px}.empty p{max-width:400px;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eef1f6;padding:16px 0;gap:15px}.row:last-child{border:0}.status{font-size:11px;background:#f0f2f6;color:#65758b;border-radius:14px;padding:5px 9px;white-space:nowrap}.notice{padding:14px 18px;margin:20px 0;background:#edf3ff;border:1px solid #dbe7ff;color:#46638e;border-radius:9px;font-size:12px;line-height:1.6}.modulegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.outline{background:white;border:1px solid #d7dfeb;border-radius:7px;padding:8px 12px;color:#315a94}iframe{width:100%;min-height:1000px;border:0;background:#f4f6fa;border-radius:12px}a{color:#2563eb}button:focus-visible,a:focus-visible{outline:3px solid #63a3ff;outline-offset:3px}@media(max-width:1100px){.metrics{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.modulegrid{grid-template-columns:1fr 1fr}}@media(max-width:760px){aside{display:none;z-index:20;top:76px;width:242px}body.open aside{display:block}.layout{margin:0}.mobile{display:inline-block}header{padding:0 16px}main{padding:20px 14px}.intro{align-items:flex-start;flex-direction:column}.metrics{gap:10px}.card{padding:16px}.modulegrid{grid-template-columns:1fr}h1{font-size:23px}}
</style></head><body><aside><div class="brand"><img id="logo" alt="" hidden><span id="company">Gestão 3D</span></div><nav id="nav" aria-label="Navegação principal"></nav><div class="sidefoot">Versão inicial • armazenamento local<br>Sem APIs ou banco online conectados.</div></aside><div class="layout"><header><div style="display:flex;align-items:center;gap:12px"><button class="mobile" id="toggle" aria-label="Abrir menu" aria-expanded="false">Menu</button><div><small>Gestão da fábrica / <span id="breadcrumb">Painel</span></small><strong>Central de operações</strong></div></div><span class="badge">Modo local</span></header><main id="main"></main></div><script>
const main=document.getElementById('main');const groups={'Visão geral':['Painel'],'Comercial':['Produtos e preços','Vendas'],'Fábrica':['Compras','Estoque','Produção'],'Resultados':['Financeiro'],'Crescimento':['Tendências','Publicidade'],'Administração':['Conexões','Configurações']};
function state(){try{return JSON.parse(localStorage.getItem('gestao3d_v1')||'{}')}catch(e){return {}}}
function branding(){const s=state().settings||{};document.getElementById('company').textContent=s.name||'Gestão 3D';const img=document.getElementById('logo');img.hidden=true;if(/^data:image\/(png|jpeg|webp);base64,/.test(s.logo||'')){img.src=s.logo;img.hidden=false}}
function intro(title,description){const div=document.createElement('div');div.className='intro';const text=document.createElement('div');const h=document.createElement('h1');h.textContent=title;const p=document.createElement('p');p.textContent=description;text.append(h,p);div.append(text);main.append(div);return div}
function show(name){document.body.classList.remove('open');document.getElementById('toggle').setAttribute('aria-expanded','false');document.getElementById('breadcrumb').textContent=name;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===name));main.replaceChildren();branding();if(name==='Painel'){intro('Sua operação, em um só lugar','Acompanhe cadastros e veja o que falta conectar para consolidar os resultados.');const count=Array.isArray(state().products)?state().products.length:0;main.insertAdjacentHTML('beforeend',`<section class="metrics" aria-label="Indicadores"><div class="card metric"><div class="label">Cenários de produto cadastrados</div><div class="value">${count}</div><div class="hint">Dados locais desta versão</div></div><div class="card metric"><div class="label">Vendas do período</div><div class="value">—</div><div class="hint">Aguardando integração de pedidos</div></div><div class="card metric"><div class="label">Produções em andamento</div><div class="value">—</div><div class="hint">Módulo ainda não implementado</div></div><div class="card metric"><div class="label">Margem realizada</div><div class="value">—</div><div class="hint">Depende de vendas e custos reais</div></div></section><section class="columns"><div class="card"><div class="cardhead"><h2>Evolução das vendas</h2><span class="status">Sem dados</span></div><div class="empty"><strong>Conecte os canais para visualizar resultados</strong><p>O gráfico será preenchido após importar e validar pedidos reais. Nenhum faturamento demonstrativo está sendo apresentado.</p><button class="outline" data-go="Conexões">Ver conexões</button></div></div><div class="card"><h2>Canais de venda</h2><div class="row"><span>Mercado Livre</span><span class="status">Não conectado</span></div><div class="row"><span>Shopee</span><span class="status">Não conectado</span></div><div class="row"><span>TikTok Shop</span><span class="status">Não conectado</span></div><p>Publicidade terá autorização e monitoramento separados.</p></div></section><section class="columns"><div class="card"><h2>Produtos e precificação</h2><p>Cadastre os custos de fabricação e simule o preço por canal com margem sobre a venda.</p><button class="primary" data-go="Produtos e preços">Abrir produtos</button></div><div class="card"><h2>Identidade da empresa</h2><p>Personalize nome, cor e logotipo ou exporte um backup dos cadastros locais.</p><button class="outline" data-go="Configurações">Abrir configurações</button></div></section><div class="notice">Os registros ficam neste navegador. Ainda não há login, sincronização entre dispositivos ou banco online. Os cadastros do protótipo antigo não foram migrados automaticamente.</div>`)}else if(['Produtos e preços','Configurações'].includes(name)){intro(name,name==='Configurações'?'Personalize sua empresa e exporte os dados locais.':'Cadastro e cálculo de custos já disponíveis na versão local.');const frame=document.createElement('iframe');frame.title=name;frame.src='../gestao/';frame.onload=()=>{try{const doc=frame.contentDocument;const nav=doc.getElementById('menu');const target=[...nav.querySelectorAll('button')].find(b=>b.textContent===name);if(target)target.click();const style=doc.createElement('style');style.textContent='body{background:#f4f6fa;font-family:system-ui;color:#1d2b42}body>header,#menu,body>.aviso{display:none}main{padding:0;max-width:none}main>h2{display:none}.card{border:1px solid #e4e9f2;box-shadow:none;border-radius:12px}input,select{background:#fbfcfe;border-color:#d6dfeb}';doc.head.append(style);frame.style.height=Math.max(900,doc.body.scrollHeight+100)+'px'}catch(e){const p=document.createElement('p');const a=document.createElement('a');a.href='../gestao/';a.textContent='Abrir a versão de gestão diretamente';p.append(a);main.append(p)}};main.append(frame)}else if(name==='Conexões'){intro('Central de conexões','Contas separadas por canal, sem credenciais fixas no código. Integrações ainda não implementadas.');const grid=document.createElement('section');grid.className='modulegrid';for(const label of ['Mercado Livre · Comercial','Mercado Ads · Publicidade','Shopee · Comercial','Shopee Ads · Publicidade','TikTok Shop · Comercial','TikTok Ads · Publicidade','Banco online']){const card=document.createElement('div');card.className='card';const h=document.createElement('h2');h.textContent=label;card.append(h);card.insertAdjacentHTML('beforeend','<p><span class="status">Não configurado</span></p><p>Conta: não vinculada<br>Última sincronização: nenhuma</p><small>Autorização, troca de conta e teste de conexão dependem da implementação no servidor. Não insira senhas ou tokens nesta página.</small>');grid.append(card)}main.append(grid)}else{intro(name,'Módulo previsto no projeto de gestão da fábrica.');main.insertAdjacentHTML('beforeend','<div class="card empty"><strong>Implementação pendente</strong><p>Esta tela organiza a navegação, mas ainda não executa operações deste módulo. Nenhuma venda, tendência ou campanha foi simulada.</p><button class="outline" data-go="Produtos e preços">Ir para produtos e preços</button></div>')}main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go))}
for(const [group,items]of Object.entries(groups)){const label=document.createElement('div');label.className='section';label.textContent=group;document.getElementById('nav').append(label);for(const item of items){const b=document.createElement('button');b.textContent=item;b.onclick=()=>show(item);document.getElementById('nav').append(b)}}document.getElementById('toggle').onclick=()=>{const open=document.body.classList.toggle('open');document.getElementById('toggle').setAttribute('aria-expanded',String(open))};window.addEventListener('storage',branding);window.addEventListener('focus',branding);show('Painel');
</script></body></html>
