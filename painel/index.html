<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fábrica 3D | Gestão</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f3f6fb;color:#22324a}aside{position:fixed;width:230px;inset:0 auto 0 0;background:#142640;color:#c8d5e8;padding:24px 14px;overflow:auto}aside h2{color:white;font-size:20px;overflow-wrap:anywhere}aside img{max-width:120px;max-height:65px}nav button{display:block;width:100%;background:none;color:inherit;text-align:left;margin:3px 0}nav button.active,nav button:hover{background:#2b4770;color:white}button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;background:#2563eb;color:white;font:inherit}button.secondary{background:#eaf0f8;color:#24486e}button.danger{background:#a53336}header{background:white;border-bottom:1px solid #e1e7f0;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}section.layout{margin-left:230px}main{padding:24px;max-width:1550px;margin:auto}h1{margin-top:0;font-size:26px}h2{font-size:17px}p,small{line-height:1.6}.muted{color:#667991}.badge{background:#fff0ca;color:#7b5a16;padding:6px 10px;border-radius:20px;font-size:12px}.card{background:white;border:1px solid #e1e7f0;border-radius:12px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}label{display:block;color:#52647b;font-size:12px}input,select{width:100%;padding:10px;border:1px solid #cdd8e6;border-radius:6px;margin-top:6px;font:inherit;background:white}input[type=file]{max-width:340px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e9edf4}th{font-size:11px;text-transform:uppercase;color:#687d98}td{font-size:13px}.metric strong{display:block;font-size:26px;margin-top:12px}.metric{border-top:3px solid #4b87e0}.notice{padding:12px;background:#fff5db;color:#70581f;border-radius:8px;margin-bottom:18px}.pill{border-radius:15px;padding:4px 9px;background:#edf2f8;color:#52647b;font-size:11px}.bar{height:8px;background:#eaf0f7;border-radius:5px;margin:8px 0 20px;overflow:hidden}.bar i{height:100%;display:block;background:#4c8adf}#message{position:sticky;top:0;padding:14px;background:#e5f5ee;color:#216445;z-index:5}#message.error{background:#ffe6e6;color:#882a2a}#message[hidden]{display:none}.mobile{display:none}button:focus-visible,a:focus-visible{outline:3px solid #579afa;outline-offset:3px}@media(max-width:800px){aside{display:none;z-index:9;top:70px}body.open aside{display:block}section.layout{margin:0}.mobile{display:inline-block}main{padding:14px}header{padding:14px}h1{font-size:22px}}@media print{aside,header,button,form,.notice{display:none!important}section.layout{margin:0}.card{break-inside:avoid}}</style></head><body><aside><img id="logo" alt="" hidden><h2 id="brand">Fábrica 3D</h2><nav id="nav" aria-label="Módulos"></nav><p><small>Versão local em validação.<br>Sem banco, login ou APIs.</small></p><a href="../gestao/" style="color:#b9d6ff">Versão anterior</a></aside><section class="layout"><header><button id="menu" class="mobile" aria-label="Abrir menu">Menu</button><strong id="crumb">Painel</strong><span class="badge">Armazenamento neste navegador</span></header><main><div id="message" role="status" hidden></div><div id="view"></div></main></section><script src="erp.js"></script></body></html>
